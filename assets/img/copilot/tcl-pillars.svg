<svg viewBox="0 0 800 380" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Manrope, sans-serif">
  <!-- Roof -->
  <rect x="60" y="40" width="680" height="64" rx="8" fill="#1A1A1A"/>
  <text x="400" y="80" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.02em">A TRUSTED AI ASSISTANT</text>

  <!-- Connectors -->
  <path d="M170 104 V140" stroke="#ECECEC" stroke-width="2"/>
  <path d="M400 104 V140" stroke="#ECECEC" stroke-width="2"/>
  <path d="M630 104 V140" stroke="#ECECEC" stroke-width="2"/>

  <!-- Pillar 1 -->
  <rect x="60" y="140" width="220" height="200" rx="8" fill="#FAFAFA" stroke="#ECECEC"/>
  <circle cx="170" cy="190" r="22" fill="#FF5A3C"/>
  <text x="170" y="198" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">T</text>
  <text x="170" y="240" text-anchor="middle" font-size="19" font-weight="800" fill="#1A1A1A">Transparency</text>
  <text x="170" y="268" text-anchor="middle" font-size="13" fill="#6B6B6B">What is it looking at,</text>
  <text x="170" y="288" text-anchor="middle" font-size="13" fill="#6B6B6B">and why this suggestion?</text>

  <!-- Pillar 2 -->
  <rect x="290" y="140" width="220" height="200" rx="8" fill="#FAFAFA" stroke="#ECECEC"/>
  <circle cx="400" cy="190" r="22" fill="#FF5A3C"/>
  <text x="400" y="198" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">C</text>
  <text x="400" y="240" text-anchor="middle" font-size="19" font-weight="800" fill="#1A1A1A">Controllability</text>
  <text x="400" y="268" text-anchor="middle" font-size="13" fill="#6B6B6B">Can I correct it and set</text>
  <text x="400" y="288" text-anchor="middle" font-size="13" fill="#6B6B6B">its boundaries, in the moment?</text>

  <!-- Pillar 3 -->
  <rect x="520" y="140" width="220" height="200" rx="8" fill="#FAFAFA" stroke="#ECECEC"/>
  <circle cx="630" cy="190" r="22" fill="#FF5A3C"/>
  <text x="630" y="198" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">L</text>
  <text x="630" y="240" text-anchor="middle" font-size="19" font-weight="800" fill="#1A1A1A">Learnability</text>
  <text x="630" y="268" text-anchor="middle" font-size="13" fill="#6B6B6B">Does it get better at</text>
  <text x="630" y="288" text-anchor="middle" font-size="13" fill="#6B6B6B">being "mine" over time?</text>
</svg>
